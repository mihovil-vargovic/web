<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mihovil Vargović — Product Designer</title>
<meta name="description" content="Mihovil Vargović — Product designer focused on crafting user-friendly, accessible experiences that drive business outcomes.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #ffffff;
    --text: #37352f;
    --muted: #6f7177;
    --card-border: #e7e7ea;
    --card-hover-bg: #f0f0f1;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c0c0d;
      --text: #f3f3f5;
      --muted: #96979c;
      --card-border: #2a2a2d;
      --card-hover-bg: #1a1a1c;
    }
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  ::selection {
    background: var(--text);
    color: var(--bg);
  }

  .wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 24px;
  }

  main {
    width: 100%;
    max-width: 440px;
  }

  h1 {
    font-size: 26.25px;
    font-weight: 600;
    letter-spacing: -0.5px;
    line-height: 34.125px;
    margin: 0 0 10px;
  }

  .role {
    font-size: clamp(1.0625rem, 1rem + 0.2vw, 1.1875rem);
    font-weight: 700;
    margin: 0 0 14px;
  }

  .bio {
    font-size: clamp(1rem, 0.95rem + 0.2vw, 1.0625rem);
    line-height: 1.6;
    color: var(--muted);
    margin: 0 0 40px;
  }

  .links-heading {
    font-size: 1.375rem;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0 0 20px;
  }

  .links {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin: 0 0 40px;
    padding: 0;
    list-style: none;
  }

  .links a {
    display: block;
    color: var(--text);
    text-decoration: none;
    font-size: 0.9375rem;
    padding: 14px 18px;
    border: 1px solid var(--card-border);
    border-radius: 16px;
    transition: background-color 0.15s ease;
  }

  .links a:hover { background-color: var(--card-hover-bg); }

  @media (max-width: 480px) {
    .wrap { padding: 32px 24px; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <main>
      <h1>Mihovil Vargović</h1>

      <p class="role">Product Designer</p>

      <p class="bio">Product designer focused on crafting user-friendly, accessible experiences that drive business outcomes.</p>

      <h2 class="links-heading">Links</h2>
      <ul class="links">
        <li><a href="http://www.linkedin.com/in/mihovilvargovic">LinkedIn</a></li>
        <li><a href="https://github.com/mihovil-vargovic">Github</a></li>
        <li><a href="https://wagnoise.tumblr.com">Experiments</a></li>
        <li><a href="https://hohshtapler.tumblr.com">Journal</a></li>
        <li><a href="#">Print</a></li>
      </ul>
    </main>
  </div>
</body>
</html>
