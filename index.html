<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mihovil Vargović — Product Designer</title>
<meta name="description" content="Mihovil Vargović — Product designer focused on crafting user-friendly, accessible experiences that drive business outcomes.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #ffffff;
    --text: #15161a;
    --muted: #6f7177;
    --tag-bg: #f3f3f5;
    --cta-bg: #15161a;
    --cta-text: #ffffff;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c0c0d;
      --text: #f3f3f5;
      --muted: #96979c;
      --tag-bg: #19191b;
      --cta-bg: #f3f3f5;
      --cta-text: #0c0c0d;
    }
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  ::selection {
    background: var(--text);
    color: var(--bg);
  }

  .wrap {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 0 24px;
  }

  main {
    width: 100%;
    max-width: 640px;
    padding-top: clamp(64px, 16vh, 168px);
    padding-bottom: 96px;
  }

  .tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--tag-bg);
    color: var(--muted);
    font-size: 0.8125rem;
    font-weight: 500;
    letter-spacing: 0.01em;
    padding: 6px 14px;
    border-radius: 999px;
    margin-bottom: 28px;
  }

  h1 {
    font-size: clamp(2.25rem, 1.85rem + 2vw, 3.25rem);
    font-weight: 700;
    letter-spacing: -0.03em;
    line-height: 1.08;
    margin: 0 0 18px;
  }

  .bio {
    font-size: clamp(1.0625rem, 1rem + 0.3vw, 1.1875rem);
    line-height: 1.65;
    color: var(--muted);
    max-width: 46ch;
    margin: 0 0 40px;
  }

  .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
  }

  .cta {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--cta-bg);
    color: var(--cta-text);
    text-decoration: none;
    font-weight: 600;
    font-size: 0.9375rem;
    padding: 13px 24px;
    border-radius: 999px;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }

  .cta:hover { opacity: 0.82; transform: translateY(-1px); }
  .cta:active { opacity: 0.65; transform: translateY(0); }

  .cta svg { width: 16px; height: 16px; }

  @media (max-width: 480px) {
    main { padding-top: 56px; padding-bottom: 64px; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <main>
      <span class="tag">Product Designer</span>

      <h1>Mihovil Vargović</h1>

      <p class="bio">Product designer focused on crafting user-friendly, accessible experiences that drive business outcomes.</p>

      <div class="actions">
        <a class="cta" href="mailto:mihovilvargovic@gmail.com">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z"/><path d="m22 6-10 7L2 6"/></svg>
          Get in touch
        </a>
      </div>
    </main>
  </div>
</body>
</html>
