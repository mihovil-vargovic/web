<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mihovil Vargović — Product Designer</title>
<meta name="description" content="Mihovil Vargović — Product designer focused on crafting user-friendly, accessible experiences that drive business outcomes.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #ffffff;
    --text: #15161a;
    --muted: #6f7177;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c0c0d;
      --text: #f3f3f5;
      --muted: #96979c;
    }
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  ::selection {
    background: var(--text);
    color: var(--bg);
  }

  .wrap {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 0 24px;
  }

  main {
    width: 100%;
    max-width: 640px;
    padding-top: clamp(64px, 16vh, 168px);
    padding-bottom: 96px;
  }

  h1 {
    font-size: clamp(2rem, 1.7rem + 1.6vw, 2.75rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.15;
    margin: 0 0 10px;
  }

  .role {
    font-size: clamp(1.0625rem, 1rem + 0.2vw, 1.1875rem);
    font-weight: 700;
    margin: 0 0 14px;
  }

  .bio {
    font-size: clamp(1rem, 0.95rem + 0.2vw, 1.0625rem);
    line-height: 1.6;
    color: var(--muted);
    max-width: 48ch;
    margin: 0 0 40px;
  }

  .links {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin: 0 0 40px;
    padding: 0;
    list-style: none;
  }

  .links a {
    color: #335cff;
    text-decoration: none;
    font-size: clamp(1rem, 0.95rem + 0.2vw, 1.0625rem);
    width: fit-content;
  }

  .links a:hover { text-decoration: underline; }

  @media (prefers-color-scheme: dark) {
    .links a { color: #6e8bff; }
  }

  @media (max-width: 480px) {
    main { padding-top: 56px; padding-bottom: 64px; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <main>
      <h1>Mihovil Vargović</h1>

      <p class="role">Product Designer</p>

      <p class="bio">Product designer focused on crafting user-friendly, accessible experiences that drive business outcomes.</p>

      <ul class="links">
        <li><a href="#">LinkedIn</a></li>
        <li><a href="#">Github</a></li>
        <li><a href="#">Experiments</a></li>
        <li><a href="#">Journal</a></li>
        <li><a href="#">Print</a></li>
      </ul>
    </main>
  </div>
</body>
</html>
